<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网协面试系统</title>
  {% load static %}
  <link href="{% static 'interview/bootstrap.min.css' %}" rel="stylesheet" />
  <script src="{% static 'interview/jquery.min.js' %}"></script>
  <script src="{% static 'interview/bootstrap.min.js' %}"></script>
  <style>
    #pagination_nav {
      margin-top: 20px;
    }

    .pagination .page-link {
      color: #007bff;
    }

    .pagination .page-item.active .page-link {
      background-color: #007bff;
      border-color: #007bff;
    }

    @media (max-width: 576px) {
      .pagination {
        flex-wrap: wrap;
        justify-content: center;
      }

      .pagination .page-item {
        margin: 2px;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
    <a class="navbar-brand" href="#">网协面试系统</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCollapse"
      aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation"><span
        class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navbarCollapse">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item active">
          <a class="nav-link" href="{% url 'interview:index' %}">面试系统 <span class="sr-only">(current)</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'admission:index' %}">录取系统</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'admin:index' %}">管理后台</a>
        </li>
      </ul>
      <form class="form-inline my-2 my-lg-0" action="{% url 'oidc_logout' %}" method="post">
        {% csrf_token %}
        <button class="btn btn-success my-2 my-sm-0" type="submit">注销</button>
      </form>
    </div>
  </nav>

  <main role="main" class="container">
    <div class="jumbotron">
      <a href="{% url 'interview:index' %}">返回</a>
      <div id="search_div">
        <div class="input-group my-3">
          <div class="input-group-prepend">
            <span class="input-group-text" id="basic-addon3">输入学号后三位或四位，回车搜索</span>
          </div>
          <input type="text" class="form-control" aria-describedby="basic-addon3" name="q" id="student_search"
            placeholder="例如：1234" />
          <div class="input-group-append">
            <button class="btn btn-outline-secondary" type="button" onclick="clear_search()" title="清除搜索">✕</button>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-6">
            <div class="form-group">
              <label for="items_per_page_select">每页显示：</label>
              <select class="form-control d-inline-block w-auto ml-2" id="items_per_page_select"
                onchange="changeItemsPerPage()">
                <option value="20" selected>20条</option>
                <option value="50">50条</option>
                <option value="100">100条</option>
              </select>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="page_jump_input">跳转到页：</label>
              <input type="number" class="form-control d-inline-block w-auto ml-2" id="page_jump_input"
                style="width: 80px !important;" min="1" onkeypress="handlePageJump(event)">
              <button class="btn btn-sm btn-outline-primary ml-1" onclick="jumpToPage()">跳转</button>
            </div>
          </div>
        </div>
      </div>
      <div id="table_div"></div>
      <nav aria-label="面试者列表分页" id="pagination_nav">
        <ul class="pagination justify-content-center" id="pagination">
        </ul>
      </nav>
    </div>
  </main>
</body>

<script>
  var interviewee_list;
  var current_page = 1;
  var items_per_page = 20;
  var total_pages = 1;
  var total_count = 0;
  var current_search = '';
  var search_mode = false;
  const charMap = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
    '/': '&#x2F;',
    '`': '&#x60;',
    '=': '&#x3D;'
  };
  function escapeHtml(string) {
    return String(string).replace(/[&<>"'`=\/]/g, function (s) {
      return charMap[s];
    });
  }
  function render_interviewee_row(item) {
    let html = '<tr class="warning">';
    html += '<td>' + escapeHtml(item.assigned_datetime) + '</td>';
    html += '<td>' + escapeHtml(item.name) + '</td>';
    html += '<td>' + escapeHtml(item.sex) + '</td>';
    html += '<td>' + escapeHtml(item.student_id) + '</td>';
    html += '<td>' + escapeHtml(item.email || "未提供") + '</td>';
    html += '<td>' + escapeHtml(item.interview_status_display) + '</td>';
    html += '<td>' + escapeHtml(item.first_preference) + '</td>';
    html += '<td>' + escapeHtml(item.second_preference) + '</td>';
    html += '<td>';
    if (!item.readonly) {
      if (item.interview_status == 1) {
        html += '<a href="interviewees/' + escapeHtml(item.id) + '/checkin">';
        html += '<button type="button" class="btn btn-primary btn-block">签到</button></a>';
      } else {
        html += '<button type="button" class="btn btn-secondary btn-block disabled">已签到</button>';
      }
    }
    html += '</td>';
    html += '<td>';
    if (item.assigned_room) {
      html += '<button type="button" class="btn btn-success btn-block">已指派' + escapeHtml(item.assigned_room) + '</button>';
    } else {
      html += '<button type="button" class="btn btn-info btn-block">未指派</button>';
    }
    html += '</td></tr>';
    return html;
  }

  function render_pagination() {
    let html = '';

    // 上一页按钮
    if (current_page > 1) {
      html += '<li class="page-item">';
      html += '<a class="page-link" href="#" onclick="changePage(' + (current_page - 1) + ')">上一页</a>';
      html += '</li>';
    } else {
      html += '<li class="page-item disabled">';
      html += '<span class="page-link">上一页</span>';
      html += '</li>';
    }

    // 页码按钮
    let start_page = Math.max(1, current_page - 2);
    let end_page = Math.min(total_pages, current_page + 2);

    if (start_page > 1) {
      html += '<li class="page-item">';
      html += '<a class="page-link" href="#" onclick="changePage(1)">1</a>';
      html += '</li>';
      if (start_page > 2) {
        html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
      }
    }

    for (let i = start_page; i <= end_page; i++) {
      if (i === current_page) {
        html += '<li class="page-item active">';
        html += '<span class="page-link">' + i + '</span>';
        html += '</li>';
      } else {
        html += '<li class="page-item">';
        html += '<a class="page-link" href="#" onclick="changePage(' + i + ')">' + i + '</a>';
        html += '</li>';
      }
    }

    if (end_page < total_pages) {
      if (end_page < total_pages - 1) {
        html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
      }
      html += '<li class="page-item">';
      html += '<a class="page-link" href="#" onclick="changePage(' + total_pages + ')">' + total_pages + '</a>';
      html += '</li>';
    }

    // 下一页按钮
    if (current_page < total_pages) {
      html += '<li class="page-item">';
      html += '<a class="page-link" href="#" onclick="changePage(' + (current_page + 1) + ')">下一页</a>';
      html += '</li>';
    } else {
      html += '<li class="page-item disabled">';
      html += '<span class="page-link">下一页</span>';
      html += '</li>';
    }

    $('#pagination').html(html);
    // 更新页面跳转输入框的最大值
    $('#page_jump_input').attr('max', total_pages);
  }

  function changePage(page) {
    if (page >= 1 && page <= total_pages) {
      current_page = page;
      get_interviewees(current_search);
    }
  }

  function changeItemsPerPage() {
    items_per_page = parseInt($('#items_per_page_select').val());
    current_page = 1; // 重置到第一页
    get_interviewees(current_search);
  }

  function jumpToPage() {
    let page = parseInt($('#page_jump_input').val());
    if (page && page >= 1 && page <= total_pages) {
      changePage(page);
      $('#page_jump_input').val('');
    } else {
      alert('请输入有效的页码 (1-' + total_pages + ')');
    }
  }

  function handlePageJump(event) {
    if (event.keyCode === 13) { // Enter键
      jumpToPage();
    }
  }

  function render_interviewee_table() {
    let html = '';
    if (interviewee_list.length == 0) {
      html += '<p>还没有面试者。</p>';
      $('#pagination_nav').hide();
    } else {
      html += '<table class="table table-hover table-responsive m-auto">';
      html += '<thead><tr><th>签到时间</th><th>姓名</th><th>性别</th><th>学号</th><th>邮箱</th><th>状态</th><th>一志愿</th><th>二志愿</th><th>签到</th><th>面试教室</th></tr></thead>';
      html += '<tbody>';

      for (let i = 0; i < interviewee_list.length; i++) {
        html += render_interviewee_row(interviewee_list[i]);
      }

      html += '</tbody></table>';

      // 显示分页信息
      let start_item = (current_page - 1) * items_per_page + 1;
      let end_item = Math.min(current_page * items_per_page, total_count);
      html += '<div class="text-center mt-3">';
      if (current_search) {
        html += '<small class="text-muted">搜索学号末位"' + current_search + '"的结果：显示第 ' + start_item + ' - ' + end_item + ' 项，共 ' + total_count + ' 项</small>';
        html += '<br><button class="btn btn-sm btn-secondary mt-1" onclick="clear_search()">清除搜索</button>';
      } else {
        html += '<small class="text-muted">显示第 ' + start_item + ' - ' + end_item + ' 项，共 ' + total_count + ' 项</small>';
      }
      html += '</div>';

      $('#pagination_nav').show();
      render_pagination();
    }
    $('#table_div').html(html);
  }

  function get_interviewees(search_query = '') {
    let request_data = {
      'page': current_page,
      'page_size': items_per_page
    };

    if (search_query) {
      request_data['search'] = search_query;
    }

    $.ajax({
      url: '/api/interviewees/',
      method: 'GET',
      data: request_data,
      dataType: 'json',
      success: function (response) {
        // 处理分页响应
        interviewee_list = response.data;
        current_page = response.pagination.current_page;
        total_pages = response.pagination.total_pages;
        total_count = response.pagination.total_count;
        current_search = response.search || '';

        // 渲染表格和分页
        render_interviewee_table();

        // 更新搜索模式状态
        search_mode = !!search_query;
      },
      error: function (xhr, status, error) {
        const html = '<p>数据获取错误，请检查网络或联系管理员。</p>';
        $('#table_div').html(html);
        $('#pagination_nav').hide();
      }
    });
  }
  function update_search_results() {
    let val = $('#student_search').val().trim();

    // 验证输入是否为数字且长度大于等于3
    if (val.length >= 3 && /^\d+$/.test(val)) {
      // 使用后端搜索
      current_page = 1; // 重置到第一页
      get_interviewees(val);
    } else if (val.length === 0) {
      // 清空搜索，显示所有结果
      current_page = 1;
      get_interviewees('');
    }
    // 如果输入不符合要求（非数字或长度不够），不执行搜索
  }

  function clear_search() {
    $('#student_search').val('');
    current_page = 1;
    get_interviewees('');
  }
  var search_timeout;

  $('document').ready(function () {
    get_interviewees();
    setInterval(function () {
      // 只有在非搜索模式或者没有新的搜索输入时才自动刷新
      if (!search_mode || !$('#student_search').val().trim()) {
        get_interviewees(current_search);
      }
    }, 5000);
  });

  $('#student_search').on('input keydown', function (event) {
    let keyCode = event.keyCode || event.which || event.charCode;

    // 回车键立即搜索
    if (keyCode == 13) {
      event.preventDefault();
      clearTimeout(search_timeout);
      update_search_results();
      return;
    }

    // 清除之前的延时搜索
    clearTimeout(search_timeout);

    // 设置延时搜索（500ms后执行）
    search_timeout = setTimeout(function () {
      update_search_results();
    }, 500);
  });
</script>

</html>
