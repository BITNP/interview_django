<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网协面试系统</title>
  {% load static %}
  <link href="{% static 'interview/bootstrap.min.css' %}" rel="stylesheet" />
  <script src="{% static 'interview/jquery.min.js' %}"></script>
  <script src="{% static 'interview/bootstrap.min.js' %}"></script>
</head>

<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
    <a class="navbar-brand" href="#">网协面试系统</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCollapse"
      aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation"><span
        class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navbarCollapse">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item active">
          <a class="nav-link" href="{% url 'interview:index' %}">面试系统 <span class="sr-only">(current)</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'admission:index' %}">录取系统</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'admin:index' %}">管理后台</a>
        </li>
      </ul>
      <form class="form-inline my-2 my-lg-0" action="{% url 'oidc_logout' %}" method="post">
        {% csrf_token %}
        <button class="btn btn-success my-2 my-sm-0" type="submit">注销</button>
      </form>
    </div>
  </nav>

  <main role="main" class="container" data-room-id="{{ room_id }}">
    <div class="jumbotron">
      <a href="{% url 'interview:index' %}">返回</a>
      <div class="table-responsive">
        <table class="table table-hover m-auto">
          <thead>
            <tr>
              <th>姓名</th>
              <th>性别</th>
              <th>学号</th>
              <th>状态</th>
              <th>接受调剂</th>
              <th>一志愿</th>
              <th>二志愿</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="interviewee-list-body">
            <!-- AJAX content goes here -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    $(document).ready(function () {
      const roomId = $('main').data('room-id');
      const intervieweeListBody = $('#interviewee-list-body');

      function fetchInterviewees() {
        $.ajax({
          url: `/api/room/${roomId}/interviewees/`,
          method: 'GET',
          dataType: 'json',
          success: function (response) {
            intervieweeListBody.empty(); // Clear existing rows
            if (response.interviewees && response.interviewees.length > 0) {
              response.interviewees.forEach(function (interviewee) {
                const row = `
                                <tr class="warning">
                                    <td>${escapeHtml(interviewee.name)}</td>
                                    <td>${escapeHtml(interviewee.sex)}</td>
                                    <td>${escapeHtml(interviewee.student_id)}</td>
                                    <td>${escapeHtml(interviewee.interview_status_display)}</td>
                                    <td>${escapeHtml(interviewee.accept_adjust)}</td>
                                    <td>${escapeHtml(interviewee.first_preference)}</td>
                                    <td>${escapeHtml(interviewee.second_preference)}</td>
                                    <td>${interviewee.action_html}</td>
                                </tr>
                            `;
                intervieweeListBody.append(row);
              });
            } else {
              intervieweeListBody.append('<tr><td colspan="7" class="text-center">还没有面试者。</td></tr>');
            }
          },
          error: function (xhr, status, error) {
            console.error("Failed to fetch interviewee data:", error);
            intervieweeListBody.empty().append('<tr><td colspan="7" class="text-center text-danger">Error loading data. Please refresh the page.</td></tr>');
          }
        });
      }

      const charMap = {
        '&': '&amp;', '<': '&lt;', '>': '&gt;',
        '"': '&quot;', "'": '&#39;', '/': '&#x2F;',
        '`': '&#x60;', '=': '&#x3D;'
      };
      function escapeHtml(string) {
        if (typeof string !== 'string') {
          return string;
        }
        return String(string).replace(/[&<>\"\'`=\/]/g, function (s) {
          return charMap[s];
        });
      }

      fetchInterviewees();
      setInterval(fetchInterviewees, 2000);
    });
  </script>
</body>

</html>
